[package]
name = "libglenda-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "glenda"
crate-type = ["staticlib", "rlib"]

[dependencies]
talc = { version = "4.4.3", optional = true }
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
bitflags = "2.10.0"
serde-big-array = "0.5.1"
num_enum = { version = "0.7.5", default-features = false }
[features]
default = []
rt-bare = ["kernel-console", "linked-list-allocator"]
rt-service = ["kernel-console", "slab-allocator"]
rt-app = ["user-console", "talc-allocator"]
kernel-console = []
user-console = []
slab-allocator = []
talc-allocator = ["talc"]
linked-list-allocator = []
